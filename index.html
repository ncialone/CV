let currentLang = "es";

function render(lang) {
  const c = CONTENT[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (c[key] !== undefined) el.textContent = c[key];
  });

  document.getElementById("langToggleBtn").textContent = lang === "es" ? "EN" : "ES";

  document.getElementById("summaryText").innerHTML =
    c.summary.map(p => `<p>${p}</p>`).join("");

  document.getElementById("experienceList").innerHTML = c.experience.map(job => {
    if (job.subroles) {
      return `
        <div class="company-block">
          <div class="company-name">${job.company}</div>
          <div class="company-meta">${job.meta}</div>
          ${job.subroles.map(sr => `
            <div class="subrole">
              <div class="subrole-title">${sr.title}</div>
              <div class="subrole-meta">${sr.meta}</div>
              <ul>${sr.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
            </div>
          `).join("")}
        </div>
      `;
    }
    return `
      <div class="job">
        <div class="job-title">${job.role} — <span class="company">${job.company}</span></div>
        <div class="job-meta">${job.meta}</div>
        <ul>${job.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
        ${job.placeholderNote ? `<div class="placeholder-note">${job.placeholderNote}</div>` : ""}
      </div>
    `;
  }).join("");

  document.getElementById("priorList").innerHTML = c.priorExperience.map(p => `
    <div class="prior-item">
      <div class="prior-head">${p.role} — ${p.company}</div>
      <div class="prior-period">${p.period}</div>
      <div class="prior-note">${p.note}</div>

  document.getElementById("educationList").innerHTML = c.education.map(ed => `
    <div class="edu-item"><span class="school">${ed.school}</span> — ${ed.detail}</div>

  document.getElementById("certsList").innerHTML =

}

/* Loads assets/nahuel-cialone.jpg and returns it as a circular PNG data
   URL (via a plain 2D canvas clip — unrelated to any screenshot library),
   so it can be dropped into the PDF as an image. Returns null if the
   photo can't be loaded (e.g. opened as a local file without a photo
   next to it), in which case the PDF is generated without it. */
async function loadCircularPhoto(url, sizePx = 320) {
  try {
    const img = new Image();
    img.crossOrigin = "anonymous";
    const ok = await new Promise(resolve => {
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = url;
    });
    if (!ok) return null;
    const canvas = document.createElement("canvas");
    canvas.width = sizePx;
    canvas.height = sizePx;
    const ctx = canvas.getContext("2d");
    ctx.beginPath();
    ctx.arc(sizePx / 2, sizePx / 2, sizePx / 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    const sx = (img.naturalWidth - side) / 2;
    const sy = (img.naturalHeight - side) / 2;
    ctx.drawImage(img, sx, sy, side, side, 0, 0, sizePx, sizePx);
    return canvas.toDataURL("image/png");
  } catch (e) {
    return null;
  }
}

/* Builds the PDF entirely with jsPDF's own text/drawing API, reading
   straight from CONTENT — no screenshot of the page is involved at any
   point. Earlier versions rasterized the whole page with html2canvas and
   embedded that as a JPEG, which looked identical on screen but meant the
   PDF had no real text layer at all: any tool that reads a PDF's text
   (an ATS, a job-portal "import your CV" parser, Ctrl+F, a screen reader)
   saw nothing and treated it as a scanned image. Drawing the text
   natively fixes that at the root, and also gives real clickable links.
   Sections are measured before they're drawn so a page break never lands
   in the middle of a role/company/bullet group, and "Experiencia Previa
   en Logística" is still forced onto its own fresh page, as before. */
async function downloadPdf() {
  const btn = document.getElementById("pdfBtnTop");
  btn.disabled = true;

  try {
    const c = CONTENT[currentLang];
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });

    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const sidebarW = 62;
    const sbPad = 8;
    const sbW = sidebarW - sbPad * 2;
    const mainX = sidebarW + 10;
    const mainW = pageW - mainX - 12;
    const topY = 18;
    const bottomLimit = pageH - 15;

    const COLOR = {
      graphite900: [29, 31, 34],
      graphite800: [42, 45, 49],
      graphite700: [58, 62, 67],
      graphite300: [183, 188, 193],
      textMain: [36, 38, 43],
      textMuted: [91, 96, 102],
      sidebarText: [231, 232, 234],
      sidebarMuted: [167, 172, 178]
    };

    const lh = size => size * 0.49;

    function drawSidebarStrip() {
      doc.setFillColor(...COLOR.graphite900);
      doc.rect(0, 0, sidebarW, pageH, "F");
    }

    let y = topY;
    function newMainPage() {
      doc.addPage();
      drawSidebarStrip();
      y = topY;
    }
    function ensureSpace(h) {
      if (y + h > bottomLimit) newMainPage();
    }

    function heading(text) {
      ensureSpace(12);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(11);
      doc.setTextColor(...COLOR.graphite800);
      doc.text(text.toUpperCase(), mainX, y);
      doc.setDrawColor(...COLOR.graphite800);
      doc.setLineWidth(0.5);
      doc.line(mainX, y + 1.8, mainX + mainW, y + 1.8);
      y += 9;
    }

    function paragraph(text, { size = 10, style = "normal", color = COLOR.textMain, gapAfter = 3 } = {}) {
      doc.setFont("helvetica", style);
      doc.setFontSize(size);
      doc.setTextColor(...color);
      const step = lh(size);
      doc.splitTextToSize(text, mainW).forEach(line => {
        ensureSpace(step);
        doc.text(line, mainX, y);
        y += step;
      });
      y += gapAfter;
    }

    // Measures the whole list first so a short list (like the
    // certifications list) doesn't get orphaned — a couple of items on
    // one page and the rest on an otherwise-empty next page.
    function bulletList(items, { size = 9.5 } = {}) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(size);
      let totalLines = 0;
      const wrapped = items.map(text => {
        const lines = doc.splitTextToSize(text, mainW - 6);
        totalLines += lines.length;
        return lines;
      });
      ensureSpace(totalLines * lh(size));

      doc.setTextColor(...COLOR.textMain);
      const step = lh(size);
      wrapped.forEach(lines => {
        lines.forEach((line, i) => {
          if (i === 0) doc.text("-", mainX, y);
          doc.text(line, mainX + 4, y);
          y += step;
        });
      });
      y += 3;
    }

    // Two-tone "Role — Company" title line (role in one color, company in
    // another, matching the on-screen design), falling back to plain
    // wrapped text if the combined string doesn't fit on one line.
    function titleLine(role, company, size, colorRole, colorCompany) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(size);
      const full = role + " — " + company;
      if (doc.getTextWidth(full) <= mainW) {
        doc.setTextColor(...colorRole);
        const roleText = role + " — ";
        doc.text(roleText, mainX, y);
        const w = doc.getTextWidth(roleText);
        doc.setTextColor(...colorCompany);
        doc.text(company, mainX + w + 0.4, y);
        y += lh(size);
      } else {
        doc.setTextColor(...colorRole);
        doc.splitTextToSize(full, mainW).forEach(line => {
          doc.text(line, mainX, y);
          y += lh(size);
        });
      }
    }

    function titleLineHeight(role, company, size) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(size);
      const full = role + " — " + company;
      const lines = doc.getTextWidth(full) <= mainW ? 1 : doc.splitTextToSize(full, mainW).length;
      return lines * lh(size);
    }

    // ---- Atomic blocks: height is measured first, then the whole block
    // is drawn as a unit, so a page break never lands mid-block. ----

    function subroleHeight(sr) {
      doc.setFont("helvetica", "bold"); doc.setFontSize(10.5);
      const titleLines = doc.splitTextToSize(sr.title, mainW - 4).length;
      doc.setFont("helvetica", "italic"); doc.setFontSize(9);
      const metaLines = doc.splitTextToSize(sr.meta, mainW - 4).length;
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
      let bulletLines = 0;
      sr.bullets.forEach(b => { bulletLines += doc.splitTextToSize(b, mainW - 8).length; });
      return titleLines * lh(10.5) + metaLines * lh(9) + bulletLines * lh(9.5) + 6;
    }

    function drawSubrole(sr) {
      ensureSpace(subroleHeight(sr));
      const startY = y - 2;

      doc.setFont("helvetica", "bold");
      doc.setFontSize(10.5);
      doc.setTextColor(...COLOR.graphite800);
      doc.splitTextToSize(sr.title, mainW - 4).forEach(line => { doc.text(line, mainX + 4, y); y += lh(10.5); });

      doc.setFont("helvetica", "italic");
      doc.setFontSize(9);
      doc.setTextColor(...COLOR.textMuted);
      doc.splitTextToSize(sr.meta, mainW - 4).forEach(line => { doc.text(line, mainX + 4, y); y += lh(9); });
      y += 1;

      doc.setFont("helvetica", "normal");
      doc.setFontSize(9.5);
      doc.setTextColor(...COLOR.textMain);
      sr.bullets.forEach(b => {
        doc.splitTextToSize(b, mainW - 8).forEach((line, i) => {
          if (i === 0) doc.text("-", mainX + 4, y);
          doc.text(line, mainX + 8, y);
          y += lh(9.5);
        });
      });

      doc.setDrawColor(...COLOR.graphite300);
      doc.setLineWidth(0.35);
      doc.line(mainX, startY, mainX, y - lh(9.5) + 1);
      y += 5;
    }

    function simpleJobHeight(job) {
      const titleH = titleLineHeight(job.role, job.company, 11);
      doc.setFont("helvetica", "italic"); doc.setFontSize(9);
      const metaH = doc.splitTextToSize(job.meta, mainW).length * lh(9);
      let bulletH = 0;
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
      job.bullets.forEach(b => { bulletH += doc.splitTextToSize(b, mainW - 4).length * lh(9.5); });
      return titleH + metaH + bulletH + 9;
    }

    function drawSimpleJob(job) {
      ensureSpace(simpleJobHeight(job));
      titleLine(job.role, job.company, 11, COLOR.graphite900, COLOR.graphite700);
      y += 1;
      doc.setFont("helvetica", "italic");
      doc.setFontSize(9);
      doc.setTextColor(...COLOR.textMuted);
      doc.splitTextToSize(job.meta, mainW).forEach(line => { doc.text(line, mainX, y); y += lh(9); });
      y += 2;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9.5);
      doc.setTextColor(...COLOR.textMain);
      job.bullets.forEach(b => {
        doc.splitTextToSize(b, mainW - 4).forEach((line, i) => {
          if (i === 0) doc.text("-", mainX, y);
          doc.text(line, mainX + 4, y);
          y += lh(9.5);
        });
      });
      y += 8;
    }

    function priorItemHeight(p) {
      const titleH = titleLineHeight(p.role, p.company, 10);
      doc.setFont("helvetica", "italic"); doc.setFontSize(9);
      const periodH = doc.splitTextToSize(p.period, mainW).length * lh(9);
      doc.setFont("helvetica", "normal"); doc.setFontSize(9);
      const noteH = doc.splitTextToSize(p.note, mainW).length * lh(9);
      return titleH + periodH + noteH + 7.5;
    }

    function drawPriorItem(p) {
      ensureSpace(priorItemHeight(p));
      titleLine(p.role, p.company, 10, COLOR.graphite900, COLOR.graphite900);
      y += 1;
      doc.setFont("helvetica", "italic");
      doc.setFontSize(9);
      doc.setTextColor(...COLOR.textMuted);
      doc.splitTextToSize(p.period, mainW).forEach(line => { doc.text(line, mainX, y); y += lh(9); });
      y += 1.5;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.setTextColor(...COLOR.textMain);
      doc.splitTextToSize(p.note, mainW).forEach(line => { doc.text(line, mainX, y); y += lh(9); });
      y += 6;
    }

    function eduLine(school, detail) {
      ensureSpace(lh(9.5) + 2);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      const label = school + " — ";
      const full = label + detail;
      if (doc.getTextWidth(full) <= mainW) {
        doc.setTextColor(...COLOR.graphite900);
        doc.text(label, mainX, y);
        const w = doc.getTextWidth(label);
        doc.setFont("helvetica", "normal");
        doc.setTextColor(...COLOR.textMain);
        doc.text(detail, mainX + w, y);
        y += lh(9.5) + 2;
      } else {
        doc.setFont("helvetica", "normal");
        doc.setTextColor(...COLOR.textMain);
        doc.splitTextToSize(full, mainW).forEach(line => {
          ensureSpace(lh(9.5));
          doc.text(line, mainX, y);
          y += lh(9.5);
        });
        y += 2;
      }
    }

    // ---------------- Sidebar (drawn once, on page 1) ----------------
    drawSidebarStrip();

    let sy = 14;
    const photo = await loadCircularPhoto("assets/nahuel-cialone.jpg");
    if (photo) {
      const photoSize = 32;
      doc.addImage(photo, "PNG", (sidebarW - photoSize) / 2, sy, photoSize, photoSize);
      sy += photoSize + 6;
    }

    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.setTextColor(255, 255, 255);
    doc.text("Nahuel Cialone", sidebarW / 2, sy, { align: "center" });
    sy += 6;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.5);
    doc.setTextColor(...COLOR.sidebarMuted);
    doc.splitTextToSize(c.tagline, sbW).forEach(line => {
      doc.text(line, sidebarW / 2, sy, { align: "center" });
      sy += 3.8;
    });
    sy += 4;

    function sidebarHeading(text) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(8.5);
      doc.setTextColor(...COLOR.sidebarMuted);
      doc.text(text.toUpperCase(), sbPad, sy);
      doc.setDrawColor(...COLOR.graphite700);
      doc.setLineWidth(0.3);
      doc.line(sbPad, sy + 1.3, sidebarW - sbPad, sy + 1.3);
      sy += 6;
    }

    // Keep these in sync with the visible contact list in the HTML above.
    function contactLine(label, text, url) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8.5);
      doc.setTextColor(...COLOR.sidebarText);
      const full = label ? `${label} ${text}` : text;
      doc.splitTextToSize(full, sbW).forEach((line, i) => {
        if (url && i === 0) doc.textWithLink(line, sbPad, sy, { url });
        else doc.text(line, sbPad, sy);
        sy += 4;
      });
      sy += 1.5;
    }

    sidebarHeading(c.contactHeading);
    contactLine("WhatsApp:", "+54 9 11 2388-8901", "https://wa.me/5491123888901");
    contactLine("Email:", "ncialone@gmail.com", "mailto:ncialone@gmail.com");
    contactLine("LinkedIn:", "linkedin.com/in/ncialone", "https://www.linkedin.com/in/ncialone");
    contactLine("GitHub:", "github.com/ncialone", "https://github.com/ncialone");
    contactLine("", c.location, null);

    sy += 2;
    sidebarHeading(c.skillsHeading);
    c.skills.forEach(s => {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(8.5);
      doc.setTextColor(255, 255, 255);
      doc.text(s.cat, sbPad, sy);
      sy += 3.8;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      doc.setTextColor(...COLOR.sidebarMuted);
      doc.splitTextToSize(s.items, sbW).forEach(line => { doc.text(line, sbPad, sy); sy += 3.4; });
      sy += 3;
    });

    // ---------------- Main content ----------------
    y = topY;

    heading(c.summaryHeading);
    c.summary.forEach(p => paragraph(p, { size: 10, gapAfter: 3 }));
    y += 3;

    heading(c.experienceHeading);
    c.experience.forEach(job => {
      if (job.subroles) {
        ensureSpace(14);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(12.5);
        doc.setTextColor(...COLOR.graphite900);
        doc.text(job.company, mainX, y);
        y += lh(12.5);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.setTextColor(...COLOR.textMuted);
        doc.splitTextToSize(job.meta, mainW).forEach(line => { doc.text(line, mainX, y); y += lh(9); });
        y += 3;
        job.subroles.forEach(drawSubrole);
        y += 3;
      } else {
        drawSimpleJob(job);
      }
    });

    // Hardcoded: "Experiencia Previa en Logística" always starts on a
    // fresh page, so it never has its heading or first entries dangling
    // at the bottom of the previous page.
    if (y !== topY) newMainPage();
    heading(c.priorHeading);
    c.priorExperience.forEach(drawPriorItem);

    y += 2;
    heading(c.educationHeading);
    c.education.forEach(ed => eduLine(ed.school, ed.detail));

    y += 3;
    // Keep the heading and its (short) list together, so the heading
    // never ends up orphaned alone at the bottom of a page.
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9.5);
    let certLines = 0;
    c.certifications.forEach(t => { certLines += doc.splitTextToSize(t, mainW - 6).length; });
    ensureSpace(12 + certLines * lh(9.5));
    heading(c.certsHeading);
    bulletList(c.certifications, { size: 9.5 });

    const filename = currentLang === "es"
      ? "CV_Nahuel_Cialone.pdf"
      : "Nahuel_Cialone_Resume.pdf";
    doc.save(filename);
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("langToggleBtn").addEventListener("click", toggleLang);
document.getElementById("pdfBtnTop").addEventListener("click", downloadPdf);

render(currentLang);
