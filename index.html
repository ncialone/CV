let currentLang = "es";

function render(lang) {
  const c = CONTENT[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (c[key] !== undefined) el.textContent = c[key];
  });

  document.getElementById("langToggleBtn").textContent = lang === "es" ? "EN" : "ES";

  document.getElementById("summaryText").innerHTML =
    c.summary.map(p => `<p>${p}</p>`).join("");

  document.getElementById("experienceList").innerHTML = c.experience.map(job => {
    if (job.subroles) {
      return `
        <div class="company-block">
          <div class="company-name">${job.company}</div>
          <div class="company-meta">${job.meta}</div>
          ${job.subroles.map(sr => `
            <div class="subrole">
              <div class="subrole-title">${sr.title}</div>
              <div class="subrole-meta">${sr.meta}</div>
              <ul>${sr.bullets.map(b => `<li>${b}</li>`).join("")}</ul>

    }
    return `
      <div class="job">
        <div class="job-title">${job.role} — <span class="company">${job.company}</span></div>
        <div class="job-meta">${job.meta}</div>
        <ul>${job.bullets.map(b => `<li>${b}</li>`).join("")}</ul>

}

/* Builds the PDF by hand with html2canvas + jsPDF instead of the higher-level
   html2pdf.js helper: that helper was found to silently squeeze this page's
   content into a ~794px-wide render (roughly A4 width in CSS pixels) no
   matter what options were passed, cropping most of the sidebar and the
   left edge of the main column on every export. Calling html2canvas
   directly captures the real, full-width element correctly, and this
   function then slices that single tall image into A4 pages itself —
   nudging each page break so it never lands in the middle of a job entry,
   a sub-role, or a "previous experience" item. */
async function downloadPdf() {
  const buttons = [document.getElementById("pdfBtnTop")];
  buttons.forEach(b => b.disabled = true);
  document.body.classList.add("pdf-mode");

  try {
    const container = document.getElementById("cv-container");
    const containerTop = container.getBoundingClientRect().top;

    const canvas = await html2canvas(container, { scale: 2, useCORS: true });
    const scaleFactor = canvas.width / container.getBoundingClientRect().width;

    // Elements that must never be split across a page break, translated
    // into their [top, bottom] range in canvas-pixel space.
    const avoidSelectors = ".job, .subrole, .company-block, .prior-item";
    const avoidRanges = Array.from(document.querySelectorAll(avoidSelectors)).map(el => {
      const r = el.getBoundingClientRect();
      return {
        top: (r.top - containerTop) * scaleFactor,
        bottom: (r.bottom - containerTop) * scaleFactor
      };
    });

    // Hardcoded: "Experiencia Previa en Logística" always starts on a
    // fresh page, rather than having its heading (or first entries) left
    // dangling at the bottom of the previous page.
    const forcedBreakTops = Array.from(document.querySelectorAll(".prior")).map(el =>
      (el.getBoundingClientRect().top - containerTop) * scaleFactor
    );

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
    const pageWidthMm = pdf.internal.pageSize.getWidth();
    const pageHeightMm = pdf.internal.pageSize.getHeight();
    const pxToMm = pageWidthMm / canvas.width;
    const basePageHeightPx = pageHeightMm / pxToMm;

    // Matches .main's own padding-top (40px) — reproduced here so a page
    // that starts with a forced section break gets the same breathing
    // room above its heading that page 1 has above "PERFIL PROFESIONAL".
    const topPaddingPx = 40 * scaleFactor;
    const sidebarWidthPx = 300 * scaleFactor;
    const sidebarColor = getComputedStyle(document.documentElement)
      .getPropertyValue("--graphite-900").trim() || "#1d1f22";

    let y = 0;
    let pageIndex = 0;
    while (y < canvas.height - 1) {
      const isForcedPageStart = forcedBreakTops.some(t => Math.abs(t - y) < 2);
      const topMargin = isForcedPageStart ? topPaddingPx : 0;

      let sliceEnd = Math.min(y + (basePageHeightPx - topMargin), canvas.height);

      // If this cut point falls inside a protected block, move it up to
      // that block's top edge so the whole block flows to the next page.
      for (const range of avoidRanges) {
        if (sliceEnd > range.top && sliceEnd < range.bottom) {
          if (range.top > y + 40) {
            sliceEnd = range.top;
          }
          break;
        }
      }

      // Forced section breaks always win, even if that leaves whitespace
      // at the bottom of the current page — but only when the section
      // doesn't already start right at the top of this page (otherwise
      // this would insert a near-blank extra page for no reason).
      for (const breakTop of forcedBreakTops) {
        if (breakTop > y + 50 && breakTop < sliceEnd) {
          sliceEnd = breakTop;
        }
      }

      const sliceHeight = Math.max(1, Math.round(sliceEnd - y));
      const pageCanvas = document.createElement("canvas");
      pageCanvas.width = canvas.width;
      pageCanvas.height = sliceHeight + topMargin;
      const ctx = pageCanvas.getContext("2d");

      if (topMargin > 0) {
        // White page background, with the sidebar's dark column carried
        // through the margin gap so it reads as one continuous panel —
        // only the main (right) column gets the extra breathing room.
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
        ctx.fillStyle = sidebarColor;
        ctx.fillRect(0, 0, sidebarWidthPx, topMargin);
      }

      ctx.drawImage(
        canvas, 0, y, canvas.width, sliceHeight,
        0, topMargin, canvas.width, sliceHeight
      );

      const imgData = pageCanvas.toDataURL("image/jpeg", 0.95);
      if (pageIndex > 0) pdf.addPage();
      pdf.addImage(imgData, "JPEG", 0, 0, pageWidthMm, (sliceHeight + topMargin) * pxToMm);

      y += sliceHeight;
      pageIndex++;
    }

    const filename = currentLang === "es"
      ? "CV_Nahuel_Cialone.pdf"
      : "Nahuel_Cialone_Resume.pdf";
    pdf.save(filename);
  } finally {
    buttons.forEach(b => b.disabled = false);
    document.body.classList.remove("pdf-mode");
  }
}

document.getElementById("langToggleBtn").addEventListener("click", toggleLang);
document.getElementById("pdfBtnTop").addEventListener("click", downloadPdf);

render(currentLang);
